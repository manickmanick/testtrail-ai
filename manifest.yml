modules:
  jira:issuePanel:
    - key: testtrail-ai-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: TestTrail AI
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/7307cf4d-9f00-47af-9099-a35099df6c3b
